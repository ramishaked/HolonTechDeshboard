name: refresh-data
# רענון BigPicture/data.json ישירות מ-shkifut.education.gov.il.
# האתר חוסם כתובות שאינן ישראליות (403), ולכן ה-job רץ על runner שמותקן על
# מחשב בישראל (תווית israel). הקמה חד-פעמית: tools/RUNNER.md.
# מופעל ידנית בלבד (workflow_dispatch). אין schedule ואין pull_request,
# כדי ששום קוד מבחוץ לא ירוץ על המחשב הזה.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'בדיקה בלבד: שליפה והשוואה, בלי commit'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'ramishaked/HolonTechDeshboard'
    runs-on: [self-hosted, israel]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: התקנת כלי האימות ודפדפן
        run: |
          npm install --prefix tools --silent
          (cd tools && npx playwright-core install chromium) || echo "משתמשים ב-Chrome המותקן"
      - name: שליפה מהאתר
        run: node tools/refresh-data.mjs ${{ inputs.dry && '--dry' || '' }}
      - name: commit ו-push
        if: ${{ !inputs.dry }}
        run: |
          git config user.name "refresh-bot"
          git config user.email "actions@github.com"
          git add BigPicture/data.json
          if git diff --cached --quiet; then echo "אין שינוי בנתונים"; exit 0; fi
          git commit -m "BigPicture: רענון data.json ישירות מ-shkifut ($(date +%d.%m.%Y))"
          git fetch origin main && git rebase origin/main
          git push origin HEAD:main
