<script>
// GitHub Pages רגיש לאותיות גדולות וקטנות. כתובת התמונה החינוכית בכל צורת כתיבה
// (BIgPicture, bigpicture) מופנית לתיקייה האמיתית, BigPicture, עם הפרמטרים שלה.
(function () {
  var m = location.pathname.match(/^(.*?\/)bigpicture(\/.*)?$/i);
  if (m && m[0].indexOf('/BigPicture') === -1) location.replace(m[1] + 'BigPicture/' + location.search + location.hash);
})();
</script>
